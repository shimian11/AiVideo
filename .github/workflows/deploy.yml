name: Deploy

on:
  push:
    branches: [master]

# 推送镜像到 GHCR 需要 packages: write 权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 登录 GitHub Container Registry
      #    GITHUB_TOKEN 是 Actions 自动提供的临时 token，无需手动配 secret
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 构建并推送 app 镜像（Dockerfile 的 runner 阶段）
      - name: 构建并推送 aivideo-app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/shimian11/aivideo-app:latest

      # 3. 构建并推送 worker 镜像（Dockerfile 的 worker 阶段）
      - name: 构建并推送 aivideo-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/shimian11/aivideo-worker:latest

      # 4. SSH 到服务器：拉取新镜像并重启
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shimian11 --password-stdin
            cd ${{ secrets.APP_DIR }}
            docker compose pull
            docker compose up -d
            docker image prune -f
