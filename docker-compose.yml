services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: agnes_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agnes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/shimian11/aivideo-app:latest
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/agnes_db?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?请在 .env 设置 NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 设置 ENCRYPTION_KEY}
      AGNES_BASE_URL: https://apihub.agnes-ai.com
    ports:
      - "3000:3000"
    command: ["node", "server.js"]

  # Worker 进程：独立运行的任务队列消费者，处理批量生成任务
  worker:
    image: ghcr.io/shimian11/aivideo-worker:latest
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/agnes_db?schema=public
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 设置 ENCRYPTION_KEY}
      AGNES_BASE_URL: https://apihub.agnes-ai.com

volumes:
  db_data:
